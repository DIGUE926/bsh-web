<svg width="1400" height="820" viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#FF6B00" stroke-width="2" opacity="0.09">
    <!-- Court boundary -->
    <rect x="20" y="20" width="1360" height="780" />

    <!-- Half court line -->
    <line x1="700" y1="20" x2="700" y2="800" />

    <!-- Center circle -->
    <circle cx="700" cy="410" r="90" />
    <circle cx="700" cy="410" r="8" />

    <!-- Left key / paint -->
    <rect x="20" y="260" width="190" height="300" />
    <circle cx="210" cy="410" r="90" />
    <line x1="20" y1="260" x2="20" y2="260" />

    <!-- Left free throw semicircle (dashed, opposite side) -->
    <path d="M 210 320 A 90 90 0 0 0 210 500" stroke-dasharray="10 8" />

    <!-- Left three point arc -->
    <path d="M 20 60 L 20 60 M 20 60 A 610 610 0 0 1 20 760" />
    <path d="M 250 60 A 480 480 0 0 1 250 760" />

    <!-- Left restricted area -->
    <circle cx="60" cy="410" r="40" />

    <!-- Right key / paint -->
    <rect x="1190" y="260" width="190" height="300" />
    <circle cx="1190" cy="410" r="90" />

    <!-- Right free throw semicircle -->
    <path d="M 1190 320 A 90 90 0 0 1 1190 500" stroke-dasharray="10 8" />

    <!-- Right three point arc -->
    <path d="M 1150 60 A 480 480 0 0 0 1150 760" />

    <!-- Right restricted area -->
    <circle cx="1340" cy="410" r="40" />
  </g>
</svg>
